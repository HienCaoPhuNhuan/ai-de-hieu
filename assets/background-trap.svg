<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="title desc"><title id="title">Đổi nền, giữ nguyên quả</title><desc id="desc">Trong dữ liệu học táo chỉ trên nền xanh và cam chỉ trên nền hồng. Phép thử đảo hai nền để kiểm tra phụ thuộc nền.</desc><defs><g id="a"><path d="M0-20C-33-41-45-10-32 18Q-21 40 0 29Q21 40 32 18C45-10 33-41 0-20" fill="#c55d43"/><path d="M0-22L6-40" stroke="#52472e" stroke-width="5"/><ellipse cx="17" cy="-34" rx="14" ry="7" fill="#427242" transform="rotate(-20 17 -34)"/></g><g id="o"><circle r="34" fill="#efa443"/><path d="M0-32Q15-50 29-32Q17-22 0-32" fill="#427242"/></g></defs><rect width="640" height="500" rx="24" fill="#edf2e4"/><g font-family="Arial,sans-serif" fill="#163c33"><text x="30" y="42" font-size="16" font-weight="bold">HỌC ĐẶC ĐIỂM QUẢ HAY ĐẶC ĐIỂM NỀN?</text><text x="30" y="90" font-size="18">Bộ học chỉ có hai kiểu ảnh</text><rect x="40" y="110" width="255" height="120" rx="12" fill="#b5d5ab"/><rect x="345" y="110" width="255" height="120" rx="12" fill="#f2c8bd"/><use href="#a" x="168" y="167"/><use href="#o" x="472" y="167"/><text x="168" y="219" text-anchor="middle" font-size="14">Táo + nền xanh</text><text x="472" y="219" text-anchor="middle" font-size="14">Cam + nền hồng</text><text x="30" y="285" font-size="18">Phép thử: đổi nền, giữ nhãn thật</text><rect x="40" y="305" width="255" height="120" rx="12" fill="#f2c8bd"/><rect x="345" y="305" width="255" height="120" rx="12" fill="#b5d5ab"/><use href="#a" x="168" y="362"/><use href="#o" x="472" y="362"/><text x="168" y="414" text-anchor="middle" font-size="14">Vẫn là táo</text><text x="472" y="414" text-anchor="middle" font-size="14">Vẫn là cam</text><text x="320" y="465" text-anchor="middle" font-size="17" font-weight="bold">Nhãn không đổi. Dự đoán có đổi không?</text></g></svg>
