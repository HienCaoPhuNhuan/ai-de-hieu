<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="title desc"><title id="title">Từ ảnh trái cây đến dự đoán</title><desc id="desc">Táo và cam được gắn nhãn để học; quả lê là ví dụ ngoài hai lớp đã học.</desc><defs><g id="apple"><path d="M0-24 C-35-48-51-13-36 21 Q-23 48 0 33 Q23 48 36 21 C51-13 35-48 0-24" fill="#d97051"/><path d="M0-23 Q-5-42 8-49" fill="none" stroke="#534d30" stroke-width="6"/><path d="M5-38 Q30-62 35-38 Q19-26 5-38" fill="#527b42"/></g><g id="orange"><circle r="39" fill="#eca34e"/><path d="M0-37 Q10-57 34-43 Q26-26 0-37" fill="#527b42"/><g fill="#ce7e32"><circle cx="-16" cy="-8" r="2"/><circle cx="8" cy="13" r="2"/><circle cx="22" cy="-7" r="2"/><circle cx="-10" cy="25" r="2"/></g></g><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#527b42"/></marker></defs><rect width="640" height="500" rx="24" fill="#edf2e4"/><g font-family="Arial,sans-serif" fill="#163c33"><text x="30" y="42" font-size="15" font-weight="bold">VÍ DỤ ĐỜI SỐNG · BÀI TOÁN HAI NHÃN</text><rect x="30" y="65" width="270" height="200" rx="15" fill="#fff"/><use href="#apple" x="100" y="150"/><use href="#orange" x="225" y="150"/><text x="100" y="220" text-anchor="middle" font-size="19">Nhãn: táo</text><text x="225" y="220" text-anchor="middle" font-size="19">Nhãn: cam</text><path d="M313 162H365" stroke="#527b42" stroke-width="3" marker-end="url(#arrow)"/><rect x="383" y="95" width="220" height="140" rx="20" fill="#163c33"/><text x="493" y="147" text-anchor="middle" font-size="24" fill="#ddf593">HUẤN LUYỆN</text><text x="493" y="182" text-anchor="middle" font-size="17" fill="#fff">Điều chỉnh tham số</text><path d="M493 246V295" stroke="#527b42" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="310" width="575" height="155" rx="15" fill="#fff"/><path d="M111 339 C87 326 89 366 73 384 C43 419 76 442 105 435 C141 446 167 414 140 383 C124 364 130 341 111 339" fill="#a3bc65"/><path d="M107 344L113 326" stroke="#534d30" stroke-width="5"/><text x="185" y="353" font-size="20" font-weight="bold">Ảnh mới: một quả lê</text><text x="185" y="388" font-size="17">Mô hình chỉ có nhãn táo / cam.</text><text x="185" y="420" font-size="17">Vẫn có thể chọn một nhãn dù sai!</text><text x="185" y="447" font-size="13" fill="#5e7169">Minh họa giới hạn, không phải kết quả thực nghiệm.</text></g></svg>
