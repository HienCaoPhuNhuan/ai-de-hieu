<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="title desc"><title id="title">Các thành phần của thùng rác thông minh</title><desc id="desc">Dòng dữ liệu đi từ camera tới xử lý ảnh và mô hình; kết quả được người dùng kiểm tra trước khi điều khiển nắp thùng.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#527b42"/></marker></defs><rect width="640" height="560" rx="24" fill="#edf2e4"/><g font-family="Arial,sans-serif" fill="#163c33"><text x="28" y="40" font-size="16" font-weight="bold">MÔ HÌNH NẰM TRONG MỘT HỆ THỐNG</text><rect x="35" y="75" width="235" height="160" rx="16" fill="#fff"/><rect x="110" y="97" width="85" height="51" rx="8" fill="#527b42"/><circle cx="153" cy="122" r="16" fill="#e0edcf"/><circle cx="153" cy="122" r="8" fill="#163c33"/><text x="153" y="180" text-anchor="middle" font-size="21">1. Camera</text><text x="153" y="208" text-anchor="middle" font-size="15">Chụp ảnh vật thể</text><rect x="370" y="75" width="235" height="160" rx="16" fill="#fff"/><text x="487" y="128" text-anchor="middle" font-size="21">2. Xử lý ảnh</text><text x="487" y="167" text-anchor="middle" font-size="15">Cắt, đổi kích thước,</text><text x="487" y="195" text-anchor="middle" font-size="15">đưa về đúng định dạng</text><path d="M282 155H355" stroke="#527b42" stroke-width="3" marker-end="url(#ar)"/><path d="M487 247V278" stroke="#527b42" stroke-width="3" marker-end="url(#ar)"/><rect x="370" y="290" width="235" height="180" rx="16" fill="#163c33"/><text x="487" y="332" text-anchor="middle" font-size="21" fill="#ddf593">3. Mô hình</text><text x="487" y="367" text-anchor="middle" font-size="15" fill="#fff">Tạo điểm dự đoán</text><text x="487" y="402" text-anchor="middle" font-size="15" fill="#fff">Ứng dụng kiểm tra</text><text x="487" y="430" text-anchor="middle" font-size="15" fill="#fff">điều kiện trước hành động</text><path d="M355 380H284" stroke="#527b42" stroke-width="3" marker-end="url(#ar)"/><rect x="35" y="290" width="235" height="180" rx="16" fill="#fff"/><rect x="54" y="315" width="60" height="43" rx="5" fill="#d9ebbd"/><text x="84" y="342" text-anchor="middle" font-size="17">Đúng?</text><path d="M180 322H224L220 372H184Z" fill="#7f9c69"/><path d="M175 315H230" stroke="#163c33" stroke-width="6"/><text x="153" y="407" text-anchor="middle" font-size="19">4. Người dùng duyệt</text><text x="153" y="439" text-anchor="middle" font-size="15">Bộ điều khiển mở nắp</text><text x="320" y="513" text-anchor="middle" font-size="17">Ghi nhận lỗi → kiểm tra → cải tiến phiên bản sau</text><text x="320" y="539" text-anchor="middle" font-size="13">Sơ đồ thiết kế giả định; phản hồi không tự huấn luyện lại mô hình.</text></g></svg>
